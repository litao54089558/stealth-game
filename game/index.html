<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Archive — a stealth game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0e13; color: #e8e4d8;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #hud { width: 1200px; max-width: 100vw; display: flex; gap: 24px; align-items: center;
    padding: 10px 4px; font-size: 14px; box-sizing: border-box; }
  #hud .spacer { flex: 1; }
  #hud-alert { display: flex; align-items: center; gap: 8px; }
  #hud-alert-bar { width: 140px; height: 10px; background: #1e242d; border: 1px solid #39434f; }
  #hud-alert-fill { height: 100%; width: 0%; background: #39d98a; }
  #hud-alert-label { min-width: 78px; font-weight: bold; letter-spacing: 1px; }
  #game { display: block; width: 1200px; max-width: 100vw; height: auto;
    background: #1e242d; touch-action: none; }
  #hint { width: 1200px; max-width: 100vw; padding: 8px 4px; font-size: 13px;
    color: #9aa7b5; box-sizing: border-box; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="hud">
  <strong id="hud-level">Level 1 — Reading Room</strong>
  <span id="hud-cards">No keycard — just reach the exit</span>
  <span class="spacer"></span>
  <span id="hud-alert"><span>Alert</span><span id="hud-alert-bar"><span id="hud-alert-fill" style="display:block"></span></span><span id="hud-alert-label">UNSEEN</span></span>
  <span id="hud-time">0:00</span>
  <span id="hud-attempts">Attempt 1</span>
</div>
<canvas id="game" aria-label="Night Archive: a top-down stealth game. Sneak past the guards' vision cones, collect keycards, and reach the green exit unseen."></canvas>
<div id="hint">Move: WASD / arrows &nbsp;·&nbsp; Sneak: hold Shift &nbsp;·&nbsp; Pause: Esc &nbsp;·&nbsp; Crates and shelves block a guard's sight. A red cone means run.</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
